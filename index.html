<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusEra — Your campus life, all in one place</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(160deg,#eef2ff,#f8fafc 60%); color:#0f172a; min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
    .wrap { max-width:460px; }
    img.logo { width:88px; height:88px; border-radius:22px; box-shadow:0 8px 24px rgba(59,130,246,0.25); margin-bottom:20px; }
    h1 { font-size:28px; margin:0 0 8px; font-weight:800; letter-spacing:-0.5px; }
    p { color:#64748b; font-size:16px; line-height:1.6; margin:0 0 26px; }
    a.cta { display:inline-block; background:linear-gradient(135deg,#3B82F6,#6D66D6); color:#fff; text-decoration:none;
      font-weight:700; font-size:16px; padding:14px 32px; border-radius:14px; box-shadow:0 10px 24px rgba(59,130,246,0.35); }
    .ig { display:block; margin-top:18px; color:#6D66D6; text-decoration:none; font-weight:600; font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="https://i.postimg.cc/xCvhWt4Z/logo.png" alt="CampusEra" />
    <h1>CampusEra</h1>
    <p>Find PGs &amp; mess near your campus, meet roommates, and join your student community — all in one app.</p>
    <a class="cta" href="https://play.google.com/store/apps/details?id=com.company.campusera&pcampaignid=web_share">Get it on Google Play</a>
    <a class="ig" href="https://www.instagram.com/campuseratech/">📸 @campuseratech</a>
  </div>
</body>
</html>
